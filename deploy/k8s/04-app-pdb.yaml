# ============================================================================
# PodDisruptionBudget (PDB)：给"自愿中断"设一条红线。
#
# 中断分两类：
#   - 非自愿：节点突然宕机、OOM 被杀 —— PDB 管不了这些。
#   - 自愿  ：节点维护/升级、手动 kubectl drain、集群缩容 —— PDB 就是保护这些场景。
#
# 含义：任何自愿中断发生时，必须始终保证至少 minAvailable 个副本可用。
#       否则 K8s 会"卡住"驱逐动作，等新副本就绪后再继续，避免服务瞬间全挂。
# ============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ofs-app
spec:
  minAvailable: 1          # 至少留 1 个可用（也可写百分比如 "50%"）
  selector:                # 保护哪些 Pod —— 同样靠标签匹配
    matchLabels:
      app: ofs-app
