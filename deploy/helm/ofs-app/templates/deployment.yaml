# 对比 deploy/k8s/01-app-deployment.yaml：结构一样，只是"会变的值"换成了 Values 占位符
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "ofs-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}           # ← 来自 values
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      # 让配置变更也能触发滚动更新：ConfigMap 内容变了，这个注解的哈希就变，Pod 会重建
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"   # ← 镜像名:标签 来自 values
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-config     # 把上面 ConfigMap 的键值全部注入为环境变量
          resources:
            {{- toYaml .Values.resources | nindent 12 }}   # ← 整块资源配额来自 values
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.service.port }}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.service.port }}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.service.port }}
            periodSeconds: 10
            failureThreshold: 3
