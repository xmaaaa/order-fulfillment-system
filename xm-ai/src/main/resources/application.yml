server:
  port: 8080                      # 独立端口，避免和订单系统的 8888 冲突

spring:
  profiles:
    active: local           # 本地默认启用 local profile → 自动读取 application-local.yml
  application:
    name: xm-ai
  ai:
    deepseek:
      # 优先读环境变量；没有则由 application-local.yml（本地/被 git 忽略）覆盖
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-chat    # DeepSeek 的通用对话模型（另有 deepseek-reasoner 推理模型）
          temperature: 0.7        # 采样温度：越高越发散，越低越稳定

# 订单系统地址（AI 工具通过 HTTP 调它）。本地 localhost:8888；上 K8s 改成 Service 名如 http://ofs-app:8888
order-system:
  base-url: http://localhost:8888

# 暴露健康端点，方便以后接 K8s 探针
management:
  endpoints:
    web:
      exposure:
        include: health,info
